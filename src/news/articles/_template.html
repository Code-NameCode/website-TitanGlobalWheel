<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TODO: change the <title> (keep " — Titan Global Wheel" at the end) -->
  <title>ARTICLE TITLE HERE — Titan Global Wheel</title>
  <!-- TODO: one-line summary used on the news index card + search results -->
  <meta name="description" content="ARTICLE SUMMARY HERE." />
  <meta name="robots" content="index, follow" />
  <!-- TODO: social share title + image (relative path to the hero image) -->
  <meta property="og:title" content="ARTICLE TITLE HERE" />
  <meta property="og:description" content="ARTICLE SUMMARY HERE." />
  <meta property="og:image" content="src/news/images/hero-image.jpg" />

  <!-- TODO: set the canonical + hreflang below with the final article URL (replace SLUG) -->
  <link rel="canonical" href="https://www.titanglobalwheel.co.za/blog/SLUG/" />
  <link rel="alternate" hreflang="en-za" href="https://www.titanglobalwheel.co.za/blog/SLUG/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../css/news.css" />
  <link rel="stylesheet" href="../../../css/site.css" />

  <style>
    :root {
      --bg: #0a0d10; --bg-2: #11151a; --surface: #161b22; --surface-2: #1d242d;
      --line: #2a323c; --text: #0a0d10; --text-invert: #f4f6f8;
      --muted: #9aa4af; --muted-invert: #b8c2cc;
      --accent: #114172; --accent-2: #e01030; --steel: #5b8bd0; --ok: #2fb672;
      --radius: 14px; --radius-lg: 22px; --maxw: 1200px;
      --shadow: 0 18px 50px -20px rgba(0,0,0,.55);
      --shadow-sm: 0 8px 24px -12px rgba(0,0,0,.45);
      --font-body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --font-display: 'Archivo', 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-body); color: var(--text); background: #fff; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; letter-spacing: -.02em; margin: 0; }
    .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }
    .skip-link { position:absolute; left:-999px; top:0; background:var(--accent); color:#fff; padding:10px 16px; z-index:100; }
    .skip-link:focus { left: 12px; top: 12px; }
  </style>
  <link rel="stylesheet" href="../../../css/mobile-nav.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <!--
      TEMPLATE: Standard article — text + hero image.
      Fill in: kicker, title, byline, hero image, body, tags, author.
      For special formats (pull-quote / spec card / image gallery) copy one of
      the 4 real articles in this folder instead and adapt it.
    -->
    <article class="article">
      <!-- TODO: change the breadcrumb category word -->
      <p class="crumb"><a href="../../../news.html">News</a> &nbsp;›&nbsp; CATEGORY</p>
      <span class="kicker">CATEGORY</span>
      <!-- TODO: headline -->
      <h1>ARTICLE TITLE HERE</h1>
      <p class="byline">
        <span>Titan Global Wheel</span>
        <span class="dot"></span>
        <!-- TODO: ISO date (YYYY-MM-DD) + a friendly display date -->
        <time datetime="2026-01-01">1 January 2026</time>
        <span class="dot"></span>
        <span>3 min read</span>
      </p>

      <figure class="hero">
        <!-- TODO: hero image. Drop the file in src/news/images/ and use a relative name -->
        <img src="hero-image.jpg" alt="Describe the hero image" />
      </figure>

      <div class="article-body">
        <!-- TODO: write the article body. Use <h2>, <p>, <ul>, etc. -->
        <p>Opening paragraph goes here.</p>
        <h2>A subheading</h2>
        <p>More body text.</p>
        <!-- Optional pull-quote:
        <div class="pull-quote">
          A memorable quote or stat.
          <span class="attrib">— Name, Role</span>
        </div>
        -->
        <!-- Optional spec card:
        <div class="spec-card">
          <h4>At a glance</h4>
          <div class="spec"><span class="k">Label</span><span class="v">Value</span></div>
        </div>
        -->
        <!-- Optional gallery:
        <div class="gallery">
          <figure><img src="extra-1.jpg" alt=""><figcaption>Caption</figcaption></figure>
        </div>
        -->
      </div>

      <!-- TODO: tag list (used for "related articles") -->
      <div class="tags">
        <span class="tag">TAG ONE</span>
        <span class="tag">TAG TWO</span>
        <span class="tag">CATEGORY</span>
      </div>

      <div class="author-card">
        <div class="avatar" aria-hidden="true">TG</div>
        <div class="who">
          <strong>Titan Global Wheel</strong>
          <span>Newsroom</span>
        </div>
      </div>
    </article>


    <!-- Share to socials — auto-filled by articles.js -->
    <section class="share" id="share" aria-labelledby="share-h"></section>
  </main>

  <div id="site-footer"></div>

  <!-- Empty inline data block — generate-news.cjs fills this in.
       (Needed so "related articles" works even when the file is opened directly.) -->
  <script type="application/json" id="news-data">{}</script>

  <!-- chrome.js delivers the shared header/footer HTML (no fetch needed);
       partials.js injects it; articles.js builds related + share -->
  <script src="../../../js/chrome.js" defer></script>
  <script src="../../../js/partials.js" defer></script>
  <script src="../../../js/articles.js" defer></script>
  <script src="../../../js/mobile-nav.js" defer></script>
</body>
</html>
